name: blacklight_app
description: Black Light — free AI solar system designer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.35.7"

dependencies:
  flutter:
    sdk: flutter
  genui: 0.7.0
  provider: ^6.1.5+1
  flutter_riverpod: ^2.6.1
  url_launcher: ^6.2.0
  http: ^1.2.0
  file_picker: ^8.1.7
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  vector_math: ^2.2.0
  flutter_gl: ^0.0.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Local developer file (gitignored): copy from assets/env.json.example
    - assets/env.json
    - assets/env.json.example

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
